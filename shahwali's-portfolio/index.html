
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahwali | Full Stack Developer & Vue Specialist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      .mono { font-family: 'JetBrains Mono', monospace; }
      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob { animation: blob 7s infinite; }
      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }
      .page-enter-active, .page-leave-active { transition: opacity 0.3s ease, transform 0.3s ease; }
      .page-enter-from { opacity: 0; transform: translateY(10px); }
      .page-leave-to { opacity: 0; transform: translateY(-10px); }
    </style>
    
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-950 text-slate-100 selection:bg-emerald-500/30">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
